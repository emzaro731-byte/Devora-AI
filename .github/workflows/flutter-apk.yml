name: Build Devora AI - Single APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'assets/devora_app_icon.jpg'
      - '.github/workflows/flutter-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name devora_ai --org com.devora.ai .
      - name: Clean corrupt Android SDK downloads
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          rm -rf "$SDK_ROOT/.downloadIntermediates"
          rm -rf "$SDK_ROOT/ndk/28.2.13676358"
          rm -rf "$SDK_ROOT/ndk/28.2.13676358.tmp"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          if ! "$SDKMANAGER" --install "ndk;28.2.13676358"; then
            rm -rf "$SDK_ROOT/.downloadIntermediates"
            rm -rf "$SDK_ROOT/ndk/28.2.13676358"
            rm -rf "$SDK_ROOT/ndk/28.2.13676358.tmp"
            "$SDKMANAGER" --install "ndk;28.2.13676358"
          fi
      - name: Install packages
        run: flutter pub get
      - name: Apply supplied Devora AI launcher icon
        run: dart run flutter_launcher_icons
      - name: Build ONE universal APK
        run: |
          flutter build apk --release --tree-shake-icons --obfuscate --split-debug-info=build/symbols
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Devora-AI.apk
          echo "APK files packaged:"
          find dist -maxdepth 1 -type f -name '*.apk' -printf '%f (%s bytes)\n'
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
      - name: Upload single APK
        uses: actions/upload-artifact@v4
        with:
          name: Devora-AI-SINGLE-APK
          path: dist/Devora-AI.apk
          if-no-files-found: error
          retention-days: 14
