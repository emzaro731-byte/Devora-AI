name: Build Devora-AI Native Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name devora_ai --org com.devoraai --overwrite /tmp/devora_android
          mkdir -p flutter_app
          cp -R /tmp/devora_android/android flutter_app/android
          mkdir -p flutter_app/android/app/src/main
          python3 - <<'PY'
          from pathlib import Path
          p = Path("flutter_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace("<application", ' <uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          s = s.replace('android:label="devora_ai"', 'android:label="Devora AI"')
          p.write_text(s)
          PY

      - name: Resolve native Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: flutter_app
        run: flutter analyze --no-pub

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Devora-AI-Native-Flutter-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
