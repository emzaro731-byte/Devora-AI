function closeModal(){$('#modalBackdrop').classList.remove('open')}
function studioType(name){if(/chat/i.test(name))return 'chat';return /music|sound|audio/i.test(name)?'music':/video|movie|lip sync|motion|transition|extend|modify|vibemv/i.test(name)?'video':'image'}
const MODEL_OPTIONS={image:[['gpt-image-2-text-to-image','GPT Image 2'],['nano-banana-2-1','Nano Banana 2.1'],['nano-banana-pro','Nano Banana Pro'],['grok-imagine-image-2-0/text-to-image','Grok Imagine Image 2.0'],['bytedance/seedream-v4-text-to-image','Seedream 4.0'],['flux-2/pro-text-to-image','FLUX.2 Pro']],video:[['veo-3-1','Veo 3.1'],['bytedance/seedance-2-5','Seedance 2.5'],['kling-3.0/video','Kling 3.0'],['grok-imagine-video-1-5-preview','Grok Imagine Video 1.5']],music:[['V6','Suno V6'],['V6_MINI','Suno V6 Mini'],['V6_WILD','Suno V6 Wild']]};
function modelSelect(type){return '<label class="hint">KIE.ai model</label><select class="field" id="modelSelect">'+MODEL_OPTIONS[type].map((m,i)=>'<option value="'+m[0]+'" '+(i===0?'selected':'')+'>'+m[1]+'</option>').join('')+'</select>'}
function openStudio(name){
 const type=studioType(name),isVideo=type==='video',isImage=type==='image';
 if(type==='chat'){action('messages');return}
 if(!session){openAuth('Sign in to create with Devora AI');return}
 openModal(name,'<p class="hint">Devora AI · Secure KIE.ai workspace</p><label class="hint">Describe what you want to create</label><textarea class="field" id="promptInput" rows="3" maxlength="5000" placeholder="Describe your idea in detail…"></textarea>'+modelSelect(type)+(isImage||isVideo?'<label class="hint">Aspect ratio</label><select class="field" id="ratio"><option value="9:16">9:16 · Portrait</option><option value="16:9" selected>16:9 · Landscape</option><option value="1:1">1:1 · Square</option><option value="4:3">4:3</option><option value="3:4">3:4</option><option value="3:2">3:2</option><option value="2:3">2:3</option><option value="21:9">21:9 · Cinematic</option></select>':'')+(isVideo?'<label class="hint">Resolution</label><select class="field" id="resolution"><option value="720p" selected>720p · Recommended</option><option value="480p">480p · Lower cost</option><option value="1080p">1080p · High quality</option></select><label class="hint">Duration</label><select class="field" id="duration"><option value="5">5 seconds</option><option value="10" selected>10 seconds</option><option value="15">15 seconds</option></select>':'')+(type==='music'?'<label class="hint">Music style / genre / vocals</label><input class="field" id="musicStyle" placeholder="Afrobeats, Afro-fusion, upbeat vocals…">':'')+'<button class="primary" id="generateBtn">Generate with KIE.ai</button><div id="generationStatus" class="hint" style="margin-top:12px"></div><p class="hint">Generation uses your KIE.ai account through a protected Supabase Edge Function. Credits are charged by the server and reconciled after completion.</p>');
 $('#generateBtn').onclick=async()=>{
  const prompt=$('#promptInput')?.value.trim();if(!prompt){toast('Describe your idea first.');return}
  const btn=$('#generateBtn'),status=$('#generationStatus'),model=$('#modelSelect').value,requestId=crypto.randomUUID();
  btn.disabled=true;btn.textContent='Starting generation…';status.textContent='Connecting securely to KIE.ai…';
  try{
   const payload={type,model,prompt,requestId};
   if($('#ratio'))payload.aspectRatio=$('#ratio').value;
   if($('#resolution'))payload.resolution=$('#resolution').value;
   if($('#duration'))payload.duration=Number($('#duration').value);
   if($('#musicStyle')&&$('#musicStyle').value.trim())payload.prompt=prompt+'; Style: '+$('#musicStyle').value.trim();
   const {data,error}=await supabaseClient.functions.invoke('devora-media',{body:payload});
   if(error)throw new Error(await functionError(error));
   if(!data||!data.success)throw new Error(data?.error||'KIE.ai could not start this task.');
   status.textContent='Task created. Waiting for KIE.ai to finish…';btn.textContent='Generating…';
   if(data.balance!==undefined&&data.balance!==null)$('#creditCount').textContent=typeof data.balance==='number'?data.balance:(data.balance?.balance??data.balance?.credits??'—');
   const result=await pollGeneration(data.taskId,data.requestId||requestId,status,btn);
   if(result.url){saveGenerated({type,title:name,model,taskId:data.taskId,url:result.url,createdAt:new Date().toISOString()});status.innerHTML='Completed! <a href="'+escapeAttr(result.url)+'" target="_blank" rel="noopener" style="color:#64dfff">Open generated media ↗</a>';btn.textContent='Generate another';btn.disabled=false;toast('Your '+type+' is ready!');}
   else {status.textContent='Task finished, but KIE.ai did not return a media URL.';btn.textContent='Try again';btn.disabled=false}
  }catch(e){status.textContent=e.message||'Generation failed.';btn.textContent='Try again';btn.disabled=false;toast('KIE.ai: '+(e.message||'Generation failed'))}
 };
}
function updateProfile(){userProfile.name=$('#nameInput').value.trim()||'Devora Creator';userProfile.handle=$('#handleInput').value.trim()||'@devora_creator';if(!userProfile.handle.startsWith('@'))userProfile.handle='@'+userProfile.handle;localStorage.setItem('devoraName',userProfile.name);localStorage.setItem('devoraHandle',userProfile.handle);$('#displayName').textContent=userProfile.name;$('#displayHandle').textContent=userProfile.handle;$('#avatar').textContent=userProfile.name[0].toUpperCase();closeModal();toast('Profile updated on this device.')}
function action(a){if(a==='edit')openModal('Edit Profile','<label class="hint">Display name</label><input class="field" id="nameInput" maxlength="40" value="'+userProfile.name.replace(/"/g,'&quot;')+'"><label class="hint">Username</label><input class="field" id="handleInput" maxlength="32" value="'+userProfile.handle.replace(/"/g,'&quot;')+'"><button class="primary" id="saveProfile">Save Profile</button>');else if(a==='settings')openModal('Settings','<p class="hint">Devora AI account and appearance</p><button class="field" id="signOutBtn">Sign out</button><p class="hint">Authentication and generation credits are managed securely through Supabase.</p>');else if(a==='messages')openModal('Devora AI Chat','<p class="hint">Ask Devora AI anything. Replies use your configured AI service.</p><div id="chatTranscript" style="display:grid;gap:10px;margin:14px 0;max-height:42dvh;overflow:auto"></div><form id="chatForm"><textarea class="field" id="chatInput" rows="3" maxlength="12000" required placeholder="Message Devora AI…"></textarea><button class="primary" id="chatSend" type="submit">Send message</button></form>');}
$('[data-view]').forEach(b=>b.addEventListener('click',()=>{ $('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');$('[data-view]').forEach(n=>n.classList.toggle('active',n===b));window.scrollTo({top:0,behavior:'smooth'});document.title=b.dataset.view==='meView'?'Devora AI — Library':'Devora AI — Create';if(b.dataset.view==='meView')renderGallery()}));
$$('[data-studio]').forEach(b=>b.addEventListener('click',()=>openStudio(b.dataset.studio)));
$$('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));
$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{currentFilter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));renderGallery()}));
$$('[data-profile-tab]').forEach(b=>b.addEventListener('click',()=>{profileTab=b.dataset.profileTab;$$('[data-profile-tab]').forEach(x=>x.classList.toggle('selected',x===b));if(profileTab==='saved'){$('#gallery').innerHTML='<p class="hint">Your saved creations will appear here.</p>'}else if(profileTab==='projects'){$('#gallery').innerHTML='<p class="hint">Your ongoing projects will appear here.</p>'}else renderGallery()}));
$('#closeModal').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});$('#modalBody').addEventListener('click',e=>{if(e.target.id==='saveProfile')updateProfile();if(e.target.id==='signOutBtn'){supabaseClient.auth.signOut();session=null;$('#creditCount').textContent='—';closeModal();openAuth('Sign in to Devora AI')};if(e.target.id==='chatFallback')openStudio('Create Image')});
$('#modalBody').addEventListener('submit',async e=>{if(e.target.id!=='chatForm')return;e.preventDefault();const input=$('#chatInput'),send=$('#chatSend'),transcript=$('#chatTranscript'),message=input.value.trim();if(!message)return;const userNode=document.createElement('div');userNode.className='chat-bubble user-bubble';userNode.textContent=message;transcript.append(userNode);input.value='';send.disabled=true;send.textContent='Thinking…';const wait=document.createElement('div');wait.className='chat-bubble assistant-bubble';wait.textContent='Devora AI is thinking…';transcript.append(wait);try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:message}]})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Chat request failed');wait.textContent=data.reply||'No response received.'}catch(err){wait.textContent=err.message||'Could not connect to Devora AI.'}finally{send.disabled=false;send.textContent='Send message';transcript.scrollTop=transcript.scrollHeight}});
$('#displayName').textContent=userProfile.name;$('#displayHandle').textContent=userProfile.handle;$('#avatar').textContent=userProfile.name[0].toUpperCase();renderGallery();
(async()=>{if(!supabaseClient){toast('Supabase client failed to load.');return}const {data}=await supabaseClient.auth.getSession();session=data?.session||null;supabaseClient.auth.onAuthStateChange((_event,newSession)=>{session=newSession;if(session)loadCredits();else $('#creditCount').textContent='—'});if(session)await loadCredits();else openAuth('Create your Devora AI account','signup')})();
</script>
</body>
</html>
