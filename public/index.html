const galleryItems=[
 {type:'Video',title:'AI Video',icon:'🎬',time:'02:45'},{type:'Image',title:'Generated Image',icon:'🧑🏽‍🎤',time:'03:12'},{type:'Video',title:'My Creations',icon:'🌆',time:'01:20'},

const SUPABASE_PUBLISHABLE_KEY='sb_publishable_HIMGxb-O6fj9O7OzT4ukuQ_jm5W8mWz';
if(window.supabase&&window.supabase.createClient)supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
function escapeAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function functionError(error){try{if(error.context&&typeof error.context.json==='function'){const d=await error.context.json();return d.error||d.message||error.message}}catch{}return error.message||'Request failed'}
function saveGenerated(item){const all=JSON.parse(localStorage.getItem('devoraGenerated')||'[]');all.unshift(item);localStorage.setItem('devoraGenerated',JSON.stringify(all.slice(0,80)));if(item.type==='image'||item.type==='video')renderGallery()}
async function pollGeneration(taskId,requestId,status,btn){for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,i===0?3000:5000));const {data,error}=await supabaseClient.functions.invoke('devora-media',{body:{action:'status',taskId,requestId}});if(error)throw new Error(await functionError(error));if(!data?.success)throw new Error(data?.error||'Could not check task status.');if(data.balance!==undefined&&data.balance!==null)$('#creditCount').textContent=typeof data.balance==='number'?data.balance:(data.balance?.balance??data.balance?.credits??'—');const state=String(data.state||'processing').toLowerCase();status.textContent='KIE.ai status: '+state+(data.progress?' · '+data.progress:'')+(data.creditsConsumed!==null&&data.creditsConsumed!==undefined?' · '+data.creditsConsumed+' credits':'');if(state==='success')return data;if(state==='fail'||state==='failed')throw new Error(data.failMsg||'KIE.ai generation failed.');if(btn)btn.textContent='Generating… '+Math.min(99,Math.round((i+1)/120*100))+'%'}throw new Error('Generation is still processing. You can close this window; check task status again later.')}

d successfully.')}catch(err){msg.textContent=err.message||'Authentication failed.'}finally{$('#authSubmit').disabled=false}}}
async function loadCredits(){if(!session||!supabaseClient)return;try{const {data,error}=await supabaseClient.functions.invoke('devora-media',{body:{action:'credits'}});if(error)throw error;if(data?.success){const b=data.balance;$('#creditCount').textContent=typeof b==='number'?b:(b?.balance??b?.credits??'—')}}catch(e){console.warn('Could not load Devora credits:',e.message)}}

function modelSelect(type){return '<label class="hint">KIE.ai model</label><select class="field" id="modelSelect">'+MODEL_OPTIONS[type].map((m,i)=>'<option value="'+m[0]+'" '+(i===0?'selected':'')+'>'+m[1]+'</option>').join('')+'</select>'}
function openStudio(name){
 const type=studioType(name),isVideo=type==='video',isImage=type==='image';
 if(!session){openAuth('Sign in to create with KIE.ai');return}
 openModal(name,'<p class="hint">Devora AI · KIE.ai generation workspace</p><label class="hint">Describe what you want to create</label><textarea class="field" id="promptInput" rows="3" maxlength="5000" placeholder="Describe your idea in detail…"></textarea>'+modelSelect(type)+(isImage||isVideo?'<label class="hint">Aspect ratio</label><select class="field" id="ratio"><option value="9:16">9:16 · Portrait</option><option value="16:9" selected>16:9 · Landscape</option><option value="1:1">1:1 · Square</option><option value="4:3">4:3</option><option value="3:4">3:4</option><option value="3:2">3:2</option><option value="2:3">2:3</option><option value="21:9">21:9 · Cinematic</option></select>':'')+(isVideo?'<label class="hint">Resolution</label><select class="field" id="resolution"><option value="720p" selected>720p · Recommended</option><option value="480p">480p · Lower cost</option><option value="1080p">1080p · High quality</option></select><label class="hint">Duration</label><select class="field" id="duration"><option value="5">5 seconds</option><option value="10" selected>10 seconds</option><option value="15">15 seconds</option></select>':'')+(type==='music'?'<label class="hint">Music style / genre / vocals</label><input class="field" id="musicStyle" placeholder="Afrobeats, Afro-fusion, upbeat vocals…">':'')+'<button class="primary" id="generateBtn">Generate with KIE.ai</button><div id="generationStatus" class="hint" style="margin-top:12px"></div><p class="hint">Generation uses your KIE.ai account through a protected Supabase Edge Function. Credits are charged by the server and reconciled after completion.</p>');
 $('#generateBtn').onclick=async()=>{
  const prompt=$('#promptInput')?.value.trim();if(!prompt){toast('Describe your idea first.');return}
  const btn=$('#generateBtn'),status=$('#generationStatus'),model=$('#modelSelect').value,requestId=crypto.randomUUID();
  btn.disabled=true;btn.textContent='Starting generation…';status.textContent='Connecting securely to KIE.ai…';
  try{
   const payload={type,model,prompt,requestId};
   if($('#ratio'))payload.aspectRatio=$('#ratio').value;
   if($('#resolution'))payload.resolution=$('#resolution').value;
   if($('#duration'))payload.duration=Number($('#duration').value);
   if($('#musicStyle')&&$('#musicStyle').value.trim())payload.prompt=prompt+'; Style: '+$('#musicStyle').value.trim();
   const {data,error}=await supabaseClient.functions.invoke('devora-media',{body:payload});
   if(error)throw new Error(await functionError(error));
   if(!data||!data.success)throw new Error(data?.error||'KIE.ai could not start this task.');
   status.textContent='Task created. Waiting for KIE.ai to finish…';btn.textContent='Generating…';
   if(data.balance!==undefined&&data.balance!==null)$('#creditCount').textContent=typeof data.balance==='number'?data.balance:(data.balance?.balance??data.balance?.credits??'—');
   const result=await pollGeneration(data.taskId,data.requestId||requestId,status,btn);
   if(result.url){saveGenerated({type,title:name,model,taskId:data.taskId,url:result.url,createdAt:new Date().toISOString()});status.innerHTML='Completed! <a href="'+escapeAttr(result.url)+'" target="_blank" rel="noopener" style="color:#64dfff">Open generated media ↗</a>';btn.textContent='Generate another';btn.disabled=false;toast('Your '+type+' is ready!');}
   else {status.textContent='Task finished, but KIE.ai did not return a media URL.';btn.textContent='Try again';btn.disabled=false}
  }catch(e){status.textContent=e.message||'Generation failed.';btn.textContent='Try again';btn.disabled=false;toast('KIE.ai: '+(e.message||'Generation failed'))}
 };
}
function updateProfile(){userProfile.name=$('#nameInput').value.trim()||'Devora Creator';userProfile.handle=$('#handleInput').value.trim()||'@devora_creator';if(!userProfile.handle.startsWith('@'))userProfile.handle='@'+userProfile.handle;localStorage.setItem('devoraName',userProfile.name);localStorage.setItem('devoraHandle',userProfile.handle);$('#displayName').textContent=userProfile.name;$('#displayHandle').textContent=userProfile.handle;$('#avatar').textContent=userProfile.name[0].toUpperCase();closeModal();toast('Profile updated on this device.')}
function action(a){if(a==='edit')openModal('Edit Profile','<label class="hint">Display name</label><input class="field" id="nameInput" maxlength="40" value="'+userProfile.name.replace(/"/g,'&quot;')+'"><label class="hint">Username</label><input class="field" id="handleInput" maxlength="32" value="'+userProfile.handle.replace(/"/g,'&quot;')+'"><button class="primary" id="saveProfile">Save Profile</button>');else if(a==='subscribe')openModal('Devora Premium','<div class="promo" style="width:100%;margin-bottom:14px">Unlock your creativity<small>More credits, premium models and faster creation</small><span class="emoji">💎</span></div><p class="hint">Choose a subscription plan or continue using your available credits. Payment checkout must be connected to your payment provider.</p><button class="primary" id="subscribeContinue">View plans</button>');else if(a==='rewards')openModal('Earn Credits','<div style="font-size:48px;text-align:center">🎁</div><h3 style="text-align:center">Earn more creation credits</h3><p class="hint">Daily rewards and referral bonuses can be enabled when the credits service is connected.</p><button class="primary" id="claimReward">Check rewards</button>');else if(a==='settings')openModal('Settings','<p class="hint">Devora AI preferences</p><button class="field" data-setting="Appearance">Appearance · Dark liquid glass</button><button class="field" data-setting="Privacy">Privacy &amp; account</button><button class="field" id="signOutBtn">Sign out</button><button class="field" data-setting="Help">Help &amp; support</button>');else if(a==='messages')openModal('Messages','<p class="hint">Your notifications and messages will appear here.</p>')}
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>{ $$('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');$$('[data-view]').forEach(n=>n.classList.toggle('active',n===b));window.scrollTo({top:0,behavior:'smooth'});if(b.dataset.view==='meView')document.title='Devora AI — Me';else document.title='Devora AI — Create'}));
$$('[data-studio]').forEach(b=>b.addEventListener('click',()=>openStudio(b.dataset.studio)));
$$('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));
$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{currentFilter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));renderGallery()}));
$$('[data-profile-tab]').forEach(b=>b.addEventListener('click',()=>{profileTab=b.dataset.profileTab;$$('[data-profile-tab]').forEach(x=>x.classList.toggle('selected',x===b));if(profileTab==='saved'){$('#gallery').innerHTML='<p class="hint">Your saved creations will appear here.</p>'}else if(profileTab==='projects'){$('#gallery').innerHTML='<p class="hint">Your ongoing projects will appear here.</p>'}else renderGallery()}));
$('#closeModal').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});$('#modalBody').addEventListener('click',e=>{if(e.target.id==='saveProfile')updateProfile();if(e.target.id==='signOutBtn'){supabaseClient.auth.signOut();session=null;$('#creditCount').textContent='—';closeModal();openAuth('Sign in to Devora AI')};if(e.target.id==='subscribeContinue')toast('Connect your subscription checkout to continue.');if(e.target.id==='claimReward')toast('Rewards will be available when the credit service is connected.');if(e.target.dataset.setting)toast(e.target.dataset.setting+' settings selected.')});
$('#displayName').textContent=userProfile.name;$('#displayHandle').textContent=userProfile.handle;$('#avatar').textContent=userProfile.name[0].toUpperCase();renderGallery();
(async()=>{if(!supabaseClient){toast('Supabase client failed to load.');return}const {data}=await supabaseClient.auth.getSession();session=data?.session||null;supabaseClient.auth.onAuthStateChange((_event,newSession)=>{session=newSession;if(session)loadCredits();else $('#creditCount').textContent='—'});if(session)await loadCredits();else openAuth('Welcome to Devora AI')})();
</script>
</body>
</html>
