<!doctype html>
<html lang="en">
<head>

<title>Devora AI — Create</title>
<style>
:root{color-scheme:dark;--bg:#07070a;--panel:#17181f;--muted:#8c8d9c;--line:#242632;--blue:#287dff;--cyan:#12d8ff;--pink:#ff4fa0;--purple:#783eff;--orange:#ff9c45}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#f7f7fc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(ellipse at 82% 0%,#20102e 0,transparent 30rem),radial-gradient(ellipse at 0% 38%,#071a33 0,transparent 28rem),#07070a}button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}.app{max-width:900px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;gap:12px;padding:20px 18px 18px}.brand{width:44px;height:44px;display:grid;place-items:center;font-size:30px;font-weight:900;background:linear-gradient(140deg,#ffb04d,#ff4fa0 50%,#704bff);color:transparent;background-clip:text}.spacer{flex:1}.icon-btn{width:48px;height:48px;border:1px solid #ffffff0c;background:#17171e;border-radius:18px;font-size:23px;display:grid;place-items:center}.credit-pill{height:48px;padding:4px 6px 4px 13px;display:flex;align-items:center;gap:9px;background:#17171f;border:1px solid #ffffff12;border-radius:25px;white-space:nowrap}.bolt{color:#ffc33e;font-weight:800}.subscribe{border:0;border-radius:24px;padding:10px 18px;background:linear-gradient(105deg,#ff9b52,#ed4aa5,#7046f5);font-weight:700}.page{padding:0 14px}.view{display:none}.view.active{display:block}.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:8px 0 24px}.feature{min-height:142px;border:1px solid #ffffff08;border-radius:23px;background:linear-gradient(125deg,#22232b,#111218);padding:19px 17px;position:relative;overflow:hidden;text-align:left;display:flex;align-items:flex-start}.feature:after{content:"";position:absolute;width:130px;height:130px;right:-18px;bottom:-38px;border-radius:30px;transform:rotate(-12deg);background:linear-gradient(135deg,#12d8ff55,#a14bff88);filter:blur(1px)}.feature:nth-child(2):after{background:linear-gradient(135deg,#19e2c355,#ff5b7a99)}.feature:nth-child(3):after{background:linear-gradient(135deg,#c95aff99,#773bff99)}.feature:nth-child(4):after{background:linear-gradient(135deg,#ffb55a88,#ff4ca588)}.feature-text{font-size:21px;font-weight:750;line-height:1.12;max-width:130px;position:relative;z-index:1}.feature-icon{position:absolute;right:18px;bottom:13px;font-size:53px;z-index:2;filter:drop-shadow(0 5px 15px #0008)}.section-label{display:flex;align-items:center;justify-content:space-between;font-size:24px;font-weight:780;margin:26px 4px 15px}.section-label small{font-size:13px;color:var(--muted);font-weight:500}.tool-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px 7px;margin:14px 0 28px}.tool{border:0;background:transparent;text-align:center;min-width:0;padding:0 2px}.tool .circle{width:min(78px,17vw);height:min(78px,17vw);margin:0 auto 10px;border-radius:50%;background:linear-gradient(145deg,#1d1e25,#111217);border:1px solid #ffffff06;display:grid;place-items:center;font-size:27px;box-shadow:inset 0 1px 0 #ffffff05}.tool span:last-child{display:block;color:#c8c8d1;font-size:13px;line-height:1.18;overflow-wrap:anywhere}.media-row{display:grid;grid-auto-columns:43%;grid-auto-flow:column;overflow-x:auto;gap:9px;padding-bottom:4px;scrollbar-width:none}.media-row::-webkit-scrollbar{display:none}.trend-card{height:255px;border-radius:19px;overflow:hidden;position:relative;background:linear-gradient(150deg,#132647,#67265e 60%,#f48b53);border:1px solid #ffffff12}.trend-card:nth-child(2){background:linear-gradient(150deg,#e18d48,#422a44 55%,#111827)}.trend-card:nth-child(3){background:linear-gradient(150deg,#301650,#172c52,#f15e9c)}.trend-art{height:100%;display:grid;place-items:center;font-size:65px;opacity:.9;background:radial-gradient(circle at 65% 30%,#ffffff22,transparent 35%)}.trend-title{position:absolute;bottom:0;left:0;right:0;padding:42px 13px 13px;font-size:18px;font-weight:750;background:linear-gradient(transparent,#000d)}.profile-head{padding:10px 5px 4px}.profile-actions{display:flex;align-items:center;gap:10px}.profile-avatar{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:54px;font-weight:800;color:#a9f2ff;background:radial-gradient(circle at 35% 25%,#0a5bba,#08132e 58%,#03050c);border:1px solid #138cff;box-shadow:0 0 22px #087bff3d,inset 0 0 24px #077cff44}.edit{margin-left:auto;border:1px solid #ffffff13;background:#25232e;border-radius:18px;padding:13px 20px}.username{font-size:36px;font-weight:750;margin:18px 0 1px}.handle{font-size:19px;color:#8389aa}.stats{display:flex;gap:26px;margin:25px 0 36px;color:#9b9bad;font-size:17px}.stats b{color:#f5f5ff}.promo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.promo{border:1px solid #ffffff13;border-radius:24px;min-height:105px;text-align:left;padding:17px 15px;position:relative;overflow:hidden;background:linear-gradient(110deg,#ff9f51,#f43fa8 58%,#593bff);font-size:20px;font-weight:780}.promo small{display:block;font-size:13px;font-weight:500;color:#fffC;margin-top:5px}.promo .emoji{position:absolute;right:13px;top:25px;font-size:33px}.promo.earn{background:linear-gradient(110deg,#35241c,#30152e)}.profile-tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;border-bottom:1px solid #292a34}.profile-tab{padding:12px;text-align:center;color:#777b91;font-size:26px;border-bottom:2px solid transparent}.profile-tab.selected{color:#f8f8ff;border-color:#11cfff}.media-switch{display:flex;gap:10px;padding:18px 0 20px}.switch{border:1px solid #5d6071;border-radius:18px;padding:12px 21px;background:transparent;color:#a6a7b5}.switch.selected{border-color:#13cfff;color:#e9fbff;box-shadow:inset 0 0 12px #13cfff18}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.gallery-card{aspect-ratio: .78;border-radius:17px;overflow:hidden;position:relative;border:1px solid #ffffff12;background:linear-gradient(145deg,#0e4b87,#42175f 60%,#f24f93);display:flex;align-items:center;justify-content:center}.gallery-card:nth-child(3n+2){background:linear-gradient(145deg,#7a3b8e,#13254b,#e05d6c)}.gallery-card:nth-child(3n){background:linear-gradient(145deg,#132e59,#17204b,#ff8d51)}.gallery-art{font-size:clamp(38px,10vw,76px);filter:drop-shadow(0 5px 18px #0009)}.gallery-label{position:absolute;left:0;right:0;bottom:0;padding:36px 9px 10px;background:linear-gradient(transparent,#000d);font-size:13px;font-weight:700}.playtime{position:absolute;top:8px;left:8px;background:#05060bba;border:1px solid #ffffff24;border-radius:30px;padding:5px 8px;font-size:11px}.bottom-nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(900px,100%);padding:10px 12px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:#08090df2;border-top:1px solid #ffffff12;backdrop-filter:blur(22px)}.nav-item{border:0;background:transparent;color:#b9bbc8;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;padding:2px}.nav-icon{font-size:26px;line-height:1.2}.nav-item.active{color:#fff}.nav-create{width:58px;height:58px;border-radius:50%;font-size:37px;color:white;background:linear-gradient(130deg,#ff9c4c,#ff3eaa,#6e3cff);box-shadow:0 0 22px #a13fff44;margin-top:-22px}.modal-backdrop{display:none;position:fixed;inset:0;z-index:40;background:#000b;backdrop-filter:blur(9px);align-items:flex-end;justify-content:center}.modal-backdrop.open{display:flex}.modal{width:min(700px,100%);background:linear-gradient(145deg,#1b1c27,#0c0d13);border:1px solid #ffffff1c;border-radius:27px 27px 0 0;padding:24px 20px calc(25px + env(safe-area-inset-bottom));max-height:85dvh;overflow:auto}.modal-top{display:flex;align-items:center;justify-content:space-between;font-size:21px;font-weight:800;margin-bottom:16px}.close{border:0;background:#ffffff12;border-radius:12px;width:38px;height:38px;font-size:22px}.field{display:block;width:100%;margin:13px 0;padding:14px;border:1px solid #ffffff1b;background:#090a10;color:white;border-radius:14px}.primary{border:0;border-radius:15px;background:linear-gradient(100deg,#ff9b4e,#f044a8,#673eff);padding:14px 18px;font-weight:750;width:100%;margin-top:8px}.hint{color:#9b9bac;font-size:13px;line-height:1.5}.toast{position:fixed;z-index:60;bottom:100px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:14px;background:#242431;border:1px solid #ffffff22;display:none;max-width:90%;text-align:center}.toast.show{display:block}
@media(min-width:650px){.page{padding:0 24px}.feature{min-height:160px}.media-row{grid-auto-columns:25%}.gallery{gap:14px}.gallery-label{font-size:15px}.tool-grid{gap:20px 10px}.profile-avatar{width:130px;height:130px}}
@media(max-width:380px){.topbar{padding-inline:12px;gap:7px}.credit-pill{gap:5px;padding-left:8px}.subscribe{padding:10px 12px}.feature{padding:15px 12px;min-height:125px}.feature-text{font-size:18px}.tool .circle{width:56px;height:56px;font-size:23px}.tool span:last-child{font-size:11px}.promo{font-size:17px;padding:14px 11px}.promo .emoji{font-size:25px}.gallery{gap:6px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand" aria-label="Devora AI">◢</div><div class="spacer"></div>
  <button class="icon-btn" aria-label="Rewards" data-action="rewards">🎁</button>
  <div class="credit-pill"><span class="bolt">ϟ</span><span id="creditCount">30</span><button class="subscribe" data-action="subscribe">Subscribe</button></div>
</header>
<main class="page">
<section id="createView" class="view active">
  <div class="hero-grid">
    <button class="feature" data-studio="Create Image"><span class="feature-text">Create<br>Image</span><span class="feature-icon">🖼️</span></button>
    <button class="feature" data-studio="Image to Video"><span class="feature-text">Image to<br>Video</span><span class="feature-icon">🎞️</span></button>
    <button class="feature" data-studio="Text to Video"><span class="feature-text">Text to<br>Video</span><span class="feature-icon">▤</span></button>
    <button class="feature" data-studio="VibeMV AI"><span class="feature-text">VibeMV AI<br><small style="font-size:12px;color:#ff83d5">NEW</small></span><span class="feature-icon">🎧</span></button>
  </div>
  <div class="tool-grid">
    <button class="tool" data-studio="Sound Effects"><span class="circle">♫✦</span><span>Sound Effect</span></button>
    <button class="tool" data-studio="Lip Sync"><span class="circle">👄</span><span>Lip-Sync</span></button>
    <button class="tool" data-studio="Edit Image"><span class="circle">▧</span><span>Edit Image</span></button>
    <button class="tool" data-studio="Transition"><span class="circle">◆</span><span>Transition</span></button>
    <button class="tool" data-studio="More tools"><span class="circle">⌃</span><span>Collapse</span></button>
    <button class="tool" data-studio="Upscale"><span class="circle">HD</span><span>Upscale</span></button>
    <button class="tool" data-studio="Motion Control"><span class="circle">♙</span><span>Motion Control</span></button>
    <button class="tool" data-studio="Reference"><span class="circle">⬡</span><span>Reference</span></button>
    <button class="tool" data-studio="Modify Video"><span class="circle">◩</span><span>Modify</span></button>
    <button class="tool" data-studio="Extend Video"><span class="circle">▣</span><span>Extend</span></button>
  </div>
  <div class="section-label">Trending <small>Explore more　›</small></div>
  <div class="media-row">
    <article class="trend-card"><div class="trend-art">🎤</div><div class="trend-title">Life of the Party</div></article>
    <article class="trend-card"><div class="trend-art">🍂</div><div class="trend-title">Not low-key today</div></article>
    <article class="trend-card"><div class="trend-art">🌌</div><div class="trend-title">Love Explosion</div></article>
  </div>
  <div class="section-label">Your creative studio <small>Make something new</small></div>
  <div class="hero-grid">
    <button class="feature" data-studio="AI Chat"><span class="feature-text">Chat with<br>Devora AI</span><span class="feature-icon">✦</span></button>
    <button class="feature" data-studio="Music Generation"><span class="feature-text">Create<br>Music</span><span class="feature-icon">🎵</span></button>
  </div>
</section>
<section id="meView" class="view">
  <div class="profile-head">
    <div class="profile-actions"><button class="icon-btn" data-action="settings" aria-label="Settings">⚙</button><button class="icon-btn" data-action="messages" aria-label="Messages">▱</button><div class="spacer"></div></div>
    <div style="display:flex;align-items:center;margin-top:26px;gap:12px"><div class="profile-avatar" id="avatar">D</div><button class="edit" data-action="edit">Edit Profile</button></div>
    <div class="username" id="displayName">Devora Creator</div><div class="handle" id="displayHandle">@devora_creator</div>
    <div class="stats"><span><b>0</b> Following</span><span><b>0</b> Followers</span></div>
  </div>
  <div class="promo-grid">
    <button class="promo" data-action="subscribe">Go Subscribe<small>More credits &amp; features</small><span class="emoji">💎</span></button>
    <button class="promo earn" data-action="rewards">Earn Credits<span class="emoji">🎁</span></button>
  </div>
  <div class="profile-tabs"><button class="profile-tab selected" data-profile-tab="gallery">▱</button><button class="profile-tab" data-profile-tab="saved">☆</button><button class="profile-tab" data-profile-tab="projects">▦</button></div>
  <div class="media-switch"><button class="switch selected" data-filter="Video">Video</button><button class="switch" data-filter="Image">Image</button></div>
  <div class="gallery" id="gallery"></div>
</section>
</main>
<nav class="bottom-nav" aria-label="Main navigation">
  <button class="nav-item active" data-view="createView"><span class="nav-icon">⌂</span><span>Create</span></button>
  <button class="nav-item" data-studio="Templates"><span class="nav-icon">▣</span><span>Template</span></button>
  <button class="nav-item" data-studio="Create"><span class="nav-create">＋</span><span style="font-size:0">Create</span></button>
  <button class="nav-item" data-studio="Discover"><span class="nav-icon">◉</span><span>Discover</span></button>
  <button class="nav-item" data-view="meView"><span class="nav-icon">♟</span><span>Me</span></button>
</nav>
</div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-top"><span id="modalTitle">Devora AI</span><button class="close" id="closeModal" aria-label="Close">×</button></div><div id="modalBody"></div></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let currentFilter='Video', profileTab='gallery', userProfile={name:localStorage.getItem('devoraName')||'Devora Creator',handle:localStorage.getItem('devoraHandle')||'@devora_creator'};
const galleryItems=[
 {type:'Video',title:'AI Video',icon:'🎬',time:'02:45'},{type:'Image',title:'Generated Image',icon:'🧑🏽‍🎤',time:'03:12'},{type:'Video',title:'My Creations',icon:'🌆',time:'01:20'},
 {type:'Video',title:'Music Video',icon:'🎙️',time:'02:37'},{type:'Image',title:'AI Artwork',icon:'🌃',time:'04:16'},{type:'Video',title:'AI Music',icon:'🎧',time:'01:03'},
 {type:'Video',title:'Your Projects',icon:'🏎️',time:'02:21'},{type:'Image',title:'AI Tools',icon:'✦',time:'00:58'},{type:'Video',title:'Tutorials',icon:'💻',time:'01:32'}
];
function renderGallery(){const items=galleryItems.filter(x=>x.type===currentFilter);$('#gallery').innerHTML=(items.length?items:[]).map((x,i)=>'<button class="gallery-card" data-gallery="'+x.title+'"><span class="gallery-art">'+x.icon+'</span><span class="playtime">▶ '+x.time+'</span><span class="gallery-label">'+x.title+'</span></button>').join('')||'<p class="hint">Your '+currentFilter.toLowerCase()+' creations will appear here after you generate them.</p>';$$('[data-gallery]').forEach(b=>b.onclick=()=>toast(b.dataset.gallery+' — open your generated media from the studio.'))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalBackdrop').classList.add('open')}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
function openStudio(name){const isImage=/image|artwork|upscale|reference/i.test(name),isVideo=/video|movie|lip sync|motion|transition|extend|modify|vibemv/i.test(name),isMusic=/music|sound|audio/i.test(name);const kind=isImage?'image':isMusic?'music':isVideo?'video':'prompt';openModal(name,'<p class="hint">Devora AI · '+name+' workspace</p><label class="hint">Describe what you want to create</label><textarea class="field" id="promptInput" rows="3" placeholder="Describe your idea in detail…"></textarea>'+(isImage||isVideo?'<label class="hint">Aspect ratio</label><select class="field" id="ratio"><option>9:16 · Portrait</option><option>16:9 · Landscape</option><option>1:1 · Square</option><option>4:5 · Social</option></select>':'')+(isVideo?'<label class="hint">Resolution</label><select class="field" id="resolution"><option>720p · Recommended</option><option>480p · Faster</option></select><label class="hint">Duration</label><select class="field" id="duration"><option>5 seconds</option><option>10 seconds</option><option>15 seconds</option></select>':'')+'<label class="hint">Upload a reference file (optional)</label><input class="field" id="mediaUpload" type="file" accept="image/*,video/*,audio/*"><button class="primary" id="generateBtn">Continue to '+name+'</button><p class="hint">This interface is ready for your connected generation workflow. Generation and credit deduction depend on the configured backend endpoint.</p>');$('#generateBtn').onclick=()=>{const prompt=$('#promptInput')?.value.trim();if(!prompt){toast('Describe your idea first.');return}closeModal();toast(name+' request prepared. Connect this studio to its generation API to create media.');document.dispatchEvent(new CustomEvent('devora:studio-request',{detail:{studio:name,prompt,ratio:$('#ratio')?.value,resolution:$('#resolution')?.value,duration:$('#duration')?.value}}))}}
function updateProfile(){userProfile.name=$('#nameInput').value.trim()||'Devora Creator';userProfile.handle=$('#handleInput').value.trim()||'@devora_creator';if(!userProfile.handle.startsWith('@'))userProfile.handle='@'+userProfile.handle;localStorage.setItem('devoraName',userProfile.name);localStorage.setItem('devoraHandle',userProfile.handle);$('#displayName').textContent=userProfile.name;$('#displayHandle').textContent=userProfile.handle;$('#avatar').textContent=userProfile.name[0].toUpperCase();closeModal();toast('Profile updated on this device.')}
function action(a){if(a==='edit')openModal('Edit Profile','<label class="hint">Display name</label><input class="field" id="nameInput" maxlength="40" value="'+userProfile.name.replace(/"/g,'&quot;')+'"><label class="hint">Username</label><input class="field" id="handleInput" maxlength="32" value="'+userProfile.handle.replace(/"/g,'&quot;')+'"><button class="primary" id="saveProfile">Save Profile</button>');else if(a==='subscribe')openModal('Devora Premium','<div class="promo" style="width:100%;margin-bottom:14px">Unlock your creativity<small>More credits, premium models and faster creation</small><span class="emoji">💎</span></div><p class="hint">Choose a subscription plan or continue using your available credits. Payment checkout must be connected to your payment provider.</p><button class="primary" id="subscribeContinue">View plans</button>');else if(a==='rewards')openModal('Earn Credits','<div style="font-size:48px;text-align:center">🎁</div><h3 style="text-align:center">Earn more creation credits</h3><p class="hint">Daily rewards and referral bonuses can be enabled when the credits service is connected.</p><button class="primary" id="claimReward">Check rewards</button>');else if(a==='settings')openModal('Settings','<p class="hint">Devora AI preferences</p><button class="field" data-setting="Appearance">Appearance · Dark liquid glass</button><button class="field" data-setting="Privacy">Privacy &amp; account</button><button class="field" data-setting="Help">Help &amp; support</button>');else if(a==='messages')openModal('Messages','<p class="hint">Your notifications and messages will appear here.</p>')}
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>{ $$('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');$$('[data-view]').forEach(n=>n.classList.toggle('active',n===b));window.scrollTo({top:0,behavior:'smooth'});if(b.dataset.view==='meView')document.title='Devora AI — Me';else document.title='Devora AI — Create'}));
$$('[data-studio]').forEach(b=>b.addEventListener('click',()=>openStudio(b.dataset.studio)));
$$('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));
$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{currentFilter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));renderGallery()}));
$$('[data-profile-tab]').forEach(b=>b.addEventListener('click',()=>{profileTab=b.dataset.profileTab;$$('[data-profile-tab]').forEach(x=>x.classList.toggle('selected',x===b));if(profileTab==='saved'){$('#gallery').innerHTML='<p class="hint">Your saved creations will appear here.</p>'}else if(profileTab==='projects'){$('#gallery').innerHTML='<p class="hint">Your ongoing projects will appear here.</p>'}else renderGallery()}));
$('#closeModal').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});$('#modalBody').addEventListener('click',e=>{if(e.target.id==='saveProfile')updateProfile();if(e.target.id==='subscribeContinue')toast('Connect your subscription checkout to continue.');if(e.target.id==='claimReward')toast('Rewards will be available when the credit service is connected.');if(e.target.dataset.setting)toast(e.target.dataset.setting+' settings selected.')});
$('#displayName').textContent=userProfile.name;$('#displayHandle').textContent=userProfile.handle;$('#avatar').textContent=userProfile.name[0].toUpperCase();renderGallery();
</script>
</body>
</html>
