function closeModal(){$('#modalBackdrop').classList.remove('open')}
function studioType(name){if(/chat/i.test(name))return 'chat';return /music|sound|audio/i.test(name)?'music':/video|movie|lip sync|motion|transition|extend|modify|vibemv/i.test(name)?'video':'image'}
const MODEL_OPTIONS={image:[['gpt-image-2-text-to-image','GPT Image 2'],['nano-banana-2-1','Nano Banana 2.1'],['nano-banana-pro','Nano Banana Pro'],['grok-imagine-image-2-0/text-to-image','Grok Imagine Image 2.0'],['bytedance/seedream-v4-text-to-image','Seedream 4.0'],['flux-2/pro-text-to-image','FLUX.2 Pro']],video:[['veo-3-1','Veo 3.1'],['bytedance/seedance-2-5','Seedance 2.5'],['kling-3.0/video','Kling 3.0'],['grok-imagine-video-1-5-preview','Grok Imagine Video 1.5']],music:[['V6','Suno V6'],['V6_MINI','Suno V6 Mini'],['V6_WILD','Suno V6 Wild']]};
function modelSelect(type){return '<label class="hint">KIE.ai model</label><select class="field" id="modelSelect">'+MODEL_OPTIONS[type].map((m,i)=>'<option value="'+m[0]+'" '+(i===0?'selected':'')+'>'+m[1]+'</option>').join('')+'</select>'}
function openStudio(name){
 const type=studioType(name),isVideo=type==='video',isImage=type==='image';
 if(type==='chat'){action('messages');return}
 if(!session){openAuth('Sign in to create with Devora AI');return}
 openModal(name,'<p class="hint">Devora AI · Secure KIE.ai workspace</p><label class="hint">Describe what you want to create</label><textarea class="field" id="promptInput" rows="3" maxlength="5000" placeholder="Describe your idea in detail…"></textarea>'+modelSelect(type)+(isImage||isVideo?'<label class="hint">Aspect ratio</label><select class="field" id="ratio"><option value="9:16">9:16 · Portrait</option><option value="16:9" selected>16:9 · Landscape</option><option value="1:1">1:1 · Square</option><option value="4:3">4:3</option><option value="3:4">3:4</option><option value="3:2">3:2</option><option value="2:3">2:3</option><option value="21:9">21:9 · Cinematic</option></select>':'')+((isImage||isVideo)?'<label class="hint">Visual style</label><select class="field" id="visualStyle"><option value="Auto">Auto · Let Devora choose</option><option value="Photorealistic">Photorealistic</option><option value="Cinematic">Cinematic film</option><option value="3D render">3D render</option><option value="Anime">Anime</option><option value="Manga">Manga</option><option value="Cartoon">Cartoon</option><option value="Pixar-inspired 3D animation">3D animated family-film look</option><option value="Watercolor">Watercolor painting</option><option value="Oil painting">Oil painting</option><option value="Digital art">Digital art</option><option value="Fantasy concept art">Fantasy concept art</option><option value="Sci-fi">Science fiction</option><option value="Cyberpunk neon">Cyberpunk neon</option><option value="Surrealism">Surrealism</option><option value="Minimalist">Minimalist</option><option value="Pixel art">Pixel art</option><option value="Comic book">Comic book</option><option value="Pencil sketch">Pencil sketch</option><option value="Fashion editorial">Fashion editorial</option><option value="Product photography">Product photography</option><option value="Architecture visualization">Architecture visualization</option><option value="Vintage film">Vintage film</option><option value="Claymation">Clay animation</option><option value="Low-poly">Low-poly 3D</option><option value="Photorealistic anime">Photorealistic anime</option></select>':'')+(isVideo?'<label class="hint">Resolution</label><select class="field" id="resolution"><option value="720p" selected>720p · Recommended</option><option value="480p">480p · Lower cost</option><option value="1080p">1080p · High quality</option></select><label class="hint">Video duration</label><select class="field" id="duration"><option value="5">5 seconds</option><option value="10" selected>10 seconds</option><option value="15">15 seconds</option><option value="30">30 seconds</option><option value="60">1 minute</option><option value="120">2 minutes</option><option value="180">3 minutes</option><option value="300">5 minutes</option><option value="600">10 minutes</option><option value="900">15 minutes</option><option value="1800">30 minutes</option><option value="3600">1 hour</option><option value="5400">1 hour 30 minutes</option><option value="7200">2 hours</option><option value="10800">3 hours</option></select><p class="hint">Long durations may require multiple clips or stitching and depend on the selected KIE.ai model. The provider may reject unsupported lengths.</p>':'')+(type==='music'?'<label class="hint">Music style / genre / vocals</label><input class="field" id="musicStyle" placeholder="Afrobeats, Afro-fusion, upbeat vocals…">':'')+'<button class="primary" id="generateBtn">Generate with KIE.ai</button><div id="generationStatus" class="hint" style="margin-top:12px"></div><p class="hint">Generation uses your KIE.ai account through a protected Supabase Edge Function. Credits are charged by the server and reconciled after completion.</p>');
 $('#generateBtn').onclick=async()=>{
  const prompt=$('#promptInput')?.value.trim();if(!prompt){toast('Describe your idea first.');return}
  const btn=$('#generateBtn'),status=$('#generationStatus'),model=$('#modelSelect').value,requestId=crypto.randomUUID();
  btn.disabled=true;btn.textContent='Starting generation…';status.textContent='Connecting securely to KIE.ai…';
  try{
   const payload={type,model,prompt,requestId};
   if($('#ratio'))payload.aspectRatio=$('#ratio').value;
   if($('#resolution'))payload.resolution=$('#resolution').value;
   if($('#duration'))payload.duration=Number($('#duration').value);
   if($('#visualStyle')&&$('#visualStyle').value!=='Auto')payload.prompt=prompt+'; Visual style: '+$('#visualStyle').value;
   if($('#musicStyle')&&$('#musicStyle').value.trim())payload.prompt=(payload.prompt||prompt)+'; Style: '+$('#musicStyle').value.trim();
   const {data,error}=await supabaseClient.functions.invoke('devora-media',{body:payload});
   if(error)throw new Error(await functionError(error));
   if(!data||!data.success)throw new Error(data?.error||'KIE.ai could not start this task.');
   status.textContent='Task created. Waiting for KIE.ai to finish…';btn.textContent='Generating…';
   if(data.balance!==undefined&&data.balance!==null)$('#creditCount').textContent=typeof data.balance==='number'?data.balance:(data.balance?.balance??data.balance?.credits??'—');
   const result=await pollGeneration(data.taskId,data.requestId||requestId,status,btn);
   if(result.url){saveGenerated({type,title:name,model,taskId:data.taskId,url:result.url,createdAt:new Date().toISOString()});status.innerHTML='Completed! <a href="'+escapeAttr(result.url)+'" target="_blank" rel="noopener" style="color:#64dfff">Open generated media ↗</a>';btn.textContent='Generate another';btn.disabled=false;toast('Your '+type+' is ready!');}
   else {status.textContent='Task finished, but KIE.ai did not return a media URL.';btn.textContent='Try again';btn.disabled=false}
  }catch(e){status.textContent=e.message||'Generation failed.';btn.textContent='Try again';btn.disabled=false;toast('KIE.ai: '+(e.message||'Generation failed'))}
 };
}
function updateProfile(){userProfile.name=$('#nameInput').value.trim()||'Devora Creator';userProfile.handle=$('#handleInput').value.trim()||'@devora_creator';if(!userProfile.handle.startsWith('@'))userProfile.handle='@'+userProfile.handle;localStorage.setItem('devoraName',userProfile.name);localStorage.setItem('devoraHandle',userProfile.handle);$('#displayName').textContent=userProfile.name;$('#displayHandle').textContent=userProfile.handle;$('#avatar').textContent=userProfile.name[0].toUpperCase();closeModal();toast('Profile updated on this device.')}
function action(a){if(a==='edit')openModal('Edit Profile','<label class="hint">Display name</label><input class="field" id="nameInput" maxlength="40" value="'+userProfile.name.replace(/"/g,'&quot;')+'"><label class="hint">Username</label><input class="field" id="handleInput" maxlength="32" value="'+userProfile.handle.replace(/"/g,'&quot;')+'"><button class="primary" id="saveProfile">Save Profile</button>');else if(a==='settings')openModal('Settings','<p class="hint">Devora AI account and appearance</p><button class="field" id="signOutBtn">Sign out</button><p class="hint">Authentication and generation credits are managed securely through Supabase.</p>');else if(a==='messages'){closeModal();document.querySelector('#chatOverlay')?.remove();document.body.classList.add('chat-mode');let chats=[];try{chats=JSON.parse(localStorage.getItem('devora_chat_history')||'[]');if(!Array.isArray(chats))chats=[]}catch(e){chats=[]}let active=null,history=[];const save=()=>{try{localStorage.setItem('devora_chat_history',JSON.stringify(chats.slice(0,50)))}catch(e){}};const title=m=>(m||'New chat').replace(/\s+/g,' ').trim().slice(0,40)||'New chat';const chat=document.createElement('section');chat.id='chatOverlay';chat.className='chat-overlay';chat.innerHTML='<aside class="chat-sidebar" id="chatSidebar"><div class="sidebar-head"><span class="sidebar-logo">D</span><strong>Devora AI</strong><button id="sidebarClose" class="sidebar-icon">‹</button></div><button id="newChatSide" class="new-chat-side">＋ <span>New chat</span></button><div class="history-label">CHAT HISTORY</div><div id="chatHistoryList" class="chat-history-list"></div><div class="sidebar-bottom"><span class="sidebar-user-icon">✦</span><div><b>Devora AI</b><small>Personal assistant</small></div></div></aside><div class="chat-workspace"><header class="chat-top"><button class="chat-back" id="chatBack" aria-label="Back">‹</button><button class="history-toggle" id="historyToggle" aria-label="Chat history">☰</button><div class="chat-brand-mark">D</div><div class="chat-heading"><strong>Devora AI</strong><small>AI assistant · GPT-OSS 120B</small></div><button class="chat-new" id="chatNew" title="New chat">＋</button></header><main class="chat-main"><div class="chat-welcome" id="chatWelcome"><div class="welcome-orb">D</div><h1>What can I help with?</h1><p>Your creative workspace for ideas, answers, and building something amazing.</p><div class="chat-suggestions"><button type="button" data-prompt="Help me build an app">▧ <span><b>Build an app</b><small>Plan and write code</small></span> ↗</button><button type="button" data-prompt="Give me creative ideas for a project">✧ <span><b>Explore ideas</b><small>Brainstorm something new</small></span> ↗</button><button type="button" data-prompt="Explain a difficult topic in simple terms">◎ <span><b>Learn something</b><small>Clear explanations</small></span> ↗</button><button type="button" data-prompt="Help me write a professional message">✎ <span><b>Write anything</b><small>Draft and improve text</small></span> ↗</button></div></div><div id="chatTranscript" class="chat-transcript" aria-live="polite"></div></main><footer class="chat-footer"><form id="chatForm" class="chat-compose"><textarea id="chatInput" rows="1" maxlength="12000" required placeholder="Message Devora AI…" aria-label="Message Devora AI"></textarea><div class="compose-bottom"><span class="compose-note">Chats saved on this device</span><button id="chatSend" type="submit" aria-label="Send message">↑</button></div></form><div class="chat-disclaimer">Devora AI can make mistakes. Check important information.</div></footer></div>';document.body.append(chat);const input=chat.querySelector('#chatInput'),form=chat.querySelector('#chatForm'),send=chat.querySelector('#chatSend'),transcript=chat.querySelector('#chatTranscript'),welcome=chat.querySelector('#chatWelcome'),main=chat.querySelector('.chat-main');const drawHistory=()=>{const list=chat.querySelector('#chatHistoryList');list.innerHTML='';if(!chats.length){list.innerHTML='<div class="history-empty">Your conversations will appear here.</div>';return}chats.forEach(item=>{const row=document.createElement('div');row.className='history-row'+(item.id===active?' selected':'');const b=document.createElement('button');b.className='history-open';b.textContent=item.title;b.onclick=()=>load(item.id);const d=document.createElement('button');d.className='history-delete';d.textContent='×';d.title='Delete conversation';d.onclick=()=>{if(!confirm('Delete this conversation?'))return;chats=chats.filter(x=>x.id!==item.id);save();if(active===item.id)fresh();drawHistory()};row.append(b,d);list.append(row)})};const render=()=>{transcript.innerHTML='';history.forEach(m=>{const node=document.createElement('article');node.className='chat-message '+(m.role==='user'?'user-message':'assistant-message');const av=document.createElement('div');av.className='chat-avatar '+(m.role==='user'?'user-avatar':'ai-avatar');av.textContent=m.role==='user'?'Y':'D';const body=document.createElement('div');body.className='chat-message-content';body.textContent=m.content;node.append(av,body);transcript.append(node)});welcome.style.display=history.length?'none':'flex';main.scrollTop=main.scrollHeight};const persist=()=>{if(!history.length)return;let item=chats.find(x=>x.id===active);if(!item){active=String(Date.now());item={id:active,title:title(history.find(m=>m.role==='user')?.content),messages:[]};chats.unshift(item)}item.title=title(history.find(m=>m.role==='user')?.content);item.messages=history.map(m=>({role:m.role,content:m.content}));item.updatedAt=Date.now();chats.sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0));chats=chats.slice(0,50);save();drawHistory()};const load=id=>{const item=chats.find(x=>x.id===id);if(!item)return;active=id;history=item.messages.map(m=>({...m}));render();drawHistory();chat.querySelector('#chatSidebar').classList.remove('sidebar-open')};const fresh=()=>{active=null;history=[];input.value='';input.style.height='auto';render();drawHistory();input.focus()};const sendMessage=async()=>{const message=input.value.trim();if(!message||send.disabled)return;history.push({role:'user',content:message});render();input.value='';input.style.height='auto';send.disabled=true;send.textContent='…';const pending=document.createElement('article');pending.className='chat-message assistant-message';pending.innerHTML='<div class="chat-avatar ai-avatar">D</div><div class="chat-message-content"><span class="thinking-dots">Thinking…</span></div>';transcript.append(pending);try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Chat request failed');history.push({role:'assistant',content:data.reply||'No response received.'})}catch(err){history.push({role:'assistant',content:'I couldn’t get a response: '+(err.message||'Please try again.')})}finally{persist();render();send.disabled=false;send.textContent='↑';input.focus()}};form.onsubmit=e=>{e.preventDefault();sendMessage()};input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};chat.querySelector('#chatBack').onclick=()=>{chat.remove();document.body.classList.remove('chat-mode')};chat.querySelector('#chatNew').onclick=fresh;chat.querySelector('#newChatSide').onclick=fresh;chat.querySelector('#historyToggle').onclick=()=>chat.querySelector('#chatSidebar').classList.toggle('sidebar-open');chat.querySelector('#sidebarClose').onclick=()=>chat.querySelector('#chatSidebar').classList.remove('sidebar-open');chat.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;sendMessage()});drawHistory();input.focus()}}
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>{$$('.view').forEach(v=>v.classList.remove('active'));const target=$('#'+b.dataset.view);if(target)target.classList.add('active');$$('[data-view]').forEach(n=>n.classList.toggle('active',n===b));window.scrollTo({top:0,behavior:'smooth'});document.title=b.dataset.view==='meView'?'Devora AI — Library':'Devora AI — Create';if(b.dataset.view==='meView')renderGallery()}));
$$('[data-studio]').forEach(b=>b.addEventListener('click',()=>openStudio(b.dataset.studio)));
$$('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));
$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{currentFilter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));renderGallery()}));
$$('[data-profile-tab]').forEach(b=>b.addEventListener('click',()=>{profileTab=b.dataset.profileTab;$$('[data-profile-tab]').forEach(x=>x.classList.toggle('selected',x===b));if(profileTab==='saved'){$('#gallery').innerHTML='<p class="hint">Your saved creations will appear here.</p>'}else if(profileTab==='projects'){$('#gallery').innerHTML='<p class="hint">Your ongoing projects will appear here.</p>'}else renderGallery()}));
$('#closeModal').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop'&&!e.currentTarget.classList.contains('auth-first'))closeModal()});$('#modalBody').addEventListener('click',e=>{if(e.target.id==='saveProfile')updateProfile();if(e.target.id==='signOutBtn'){supabaseClient.auth.signOut();session=null;$('#creditCount').textContent='—';closeModal();openAuth('Sign in to Devora AI')};if(e.target.id==='chatFallback')openStudio('Create Image')});
$('#modalBody').addEventListener('submit',async e=>{if(e.target.id!=='chatForm')return;e.preventDefault();const input=$('#chatInput'),send=$('#chatSend'),transcript=$('#chatTranscript'),message=input.value.trim();if(!message)return;const userNode=document.createElement('div');userNode.className='chat-bubble user-bubble';userNode.textContent=message;transcript.append(userNode);input.value='';send.disabled=true;send.textContent='Thinking…';const wait=document.createElement('div');wait.className='chat-bubble assistant-bubble';wait.textContent='Devora AI is thinking…';transcript.append(wait);try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:message}]})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Chat request failed');wait.textContent=data.reply||'No response received.'}catch(err){wait.textContent=err.message||'Could not connect to Devora AI.'}finally{send.disabled=false;send.textContent='Send message';transcript.scrollTop=transcript.scrollHeight}});
$('#displayName').textContent=userProfile.name;$('#displayHandle').textContent=userProfile.handle;$('#avatar').textContent=userProfile.name[0].toUpperCase();renderGallery();
(async()=>{try{if(!supabaseClient){openAuth('Supabase connection unavailable','signup');$('#authMessage').textContent='Supabase client did not load. Check your connection and refresh.';return}const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;session=data?.session||null;supabaseClient.auth.onAuthStateChange((_event,newSession)=>{session=newSession;if(session)loadCredits();else $('#creditCount').textContent='—'});if(session)await loadCredits();else openAuth('Create your Devora AI account','signup')}catch(err){console.error('Devora session initialization failed:',err);openAuth('Create your Devora AI account','signup');const msg=$('#authMessage');if(msg)msg.textContent='Could not connect to authentication: '+(err.message||'Unknown error')+' — check internet and Supabase Auth settings.'}})();
</script>
