<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#212121"><title>Devora-AI</title>
<style>
:root{color-scheme:dark;--bg:#212121;--panel:#171717;--text:#ececec;--muted:#a0a0a0;--line:#383838;--accent:#10a37f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}button,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{height:100dvh;display:flex}.sidebar{width:260px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:8px 4px}.logo{display:grid;place-items:center;background:var(--accent);color:#fff;width:32px;height:32px;border-radius:11px;font-weight:800}.newchat,.sideitem{border:1px solid var(--line);background:transparent;border-radius:10px;padding:11px;text-align:left}.newchat:hover,.sideitem:hover{background:#2a2a2a}.side-label{font-size:12px;color:var(--muted);margin:16px 5px 0}.history{color:var(--muted);font-size:13px;padding:8px 5px}.profile{margin-top:auto;border-top:1px solid var(--line);padding:14px 4px 4px;display:flex;gap:10px;align-items:center}.avatar{background:#454545;border-radius:50%;width:32px;height:32px;display:grid;place-items:center}.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #ffffff08}.top-title{font-weight:600}.top-actions{display:flex;gap:8px}.iconbtn{background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 10px}.mobile-menu{display:none}.content{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center}.welcome{margin:auto;max-width:740px;width:100%;padding:32px 22px 48px;text-align:center}.welcome h1{font-size:clamp(28px,4vw,38px);letter-spacing:-1.2px;margin:0 0 10px}.welcome p{color:var(--muted);margin:0 0 28px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:left}.suggestion{border:1px solid var(--line);border-radius:14px;padding:14px;background:#ffffff04}.suggestion b{display:block;font-size:14px;margin-bottom:3px}.suggestion span{color:var(--muted);font-size:13px}.messages{width:100%;max-width:800px;padding:22px 22px 34px;display:flex;flex-direction:column;gap:25px}.message{display:flex;gap:13px;align-items:flex-start}.msg-avatar{width:30px;height:30px;flex-shrink:0;border-radius:10px;background:#343434;display:grid;place-items:center;font-size:12px;font-weight:700}.message.assistant .msg-avatar{background:var(--accent)}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding-top:3px;flex:1}.message.user .bubble{background:#303030;border-radius:18px;padding:11px 15px;flex:initial;max-width:85%}.message.user{justify-content:flex-end}.message.user .msg-avatar{order:2}.composer-wrap{width:100%;max-width:840px;padding:0 20px 14px;margin:0 auto}.composer{display:flex;gap:10px;align-items:flex-end;background:#2f2f2f;border:1px solid #484848;border-radius:24px;padding:10px 10px 10px 18px;box-shadow:0 8px 30px #0002}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);min-height:30px;max-height:180px;padding:5px 0}.send{width:38px;height:38px;border:0;border-radius:50%;background:var(--text);color:#222;font-size:20px;font-weight:700}.send:disabled{opacity:.4}.disclaimer{text-align:center;color:var(--muted);font-size:11px;margin-top:9px}.typing{color:var(--muted)}.hidden{display:none!important}.error{color:#ffaaa5}
@media(max-width:680px){.sidebar{position:absolute;z-index:5;inset:0 auto 0 0;width:280px;transform:translateX(-105%);transition:transform .2s;box-shadow:12px 0 40px #0005}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-block}.topbar{padding:0 12px}.welcome{padding:24px 18px}.suggestions{grid-template-columns:1fr}.composer-wrap{padding:0 10px 10px}.messages{padding:18px 14px 28px}.welcome h1{font-size:29px}}
</style></head>
<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">D</div>Devora-AI</div><button class="newchat" id="newChat">＋ &nbsp; New chat</button><div class="side-label">YOUR CHATS</div><div class="history" id="history">Your conversations will appear here.</div><div class="profile"><div class="avatar">D</div><div><b>Devora-AI</b><div style="font-size:12px;color:var(--muted)">AI assistant</div></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="iconbtn mobile-menu" id="menu">☰</button><div class="top-title">Devora-AI <span style="color:var(--muted);font-weight:400">⌄</span></div></div><div class="top-actions"><button class="iconbtn" id="clear">Clear chat</button></div></header><section class="content" id="content"><div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Ask questions, explore ideas, and get help with coding.</p><div class="suggestions"><button class="suggestion" data-prompt="Explain a difficult topic in simple terms"><b>✦ Learn something</b><span>Explain any topic simply</span></button><button class="suggestion" data-prompt="Help me write a professional email"><b>✎ Write anything</b><span>Draft, rewrite, or improve text</span></button><button class="suggestion" data-prompt="Help me understand or write code"><b>⌘ Coding help</b><span>Understand, write, and debug code</span></button><button class="suggestion" data-prompt="Give me creative ideas for a new project"><b>◎ Brainstorm ideas</b><span>Explore ideas and possibilities</span></button></div></div><div class="messages hidden" id="messages"></div></section><div class="composer-wrap"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Message Devora-AI..." aria-label="Message Devora-AI"></textarea><button class="send" id="send" aria-label="Send message">↑</button></form><div class="disclaimer">Devora-AI can make mistakes. Check important information.</div></div></main></div>
<script>
const $=s=>document.querySelector(s), input=$('#input'), messagesEl=$('#messages'), welcome=$('#welcome'), content=$('#content');let messages=[],busy=false;
function showChat(){welcome.classList.add('hidden');messagesEl.classList.remove('hidden')}
function addMessage(role,text){const row=document.createElement('div');row.className='message '+role;const av=document.createElement('div');av.className='msg-avatar';av.textContent=role==='user'?'Y':'D';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;row.append(av,bubble);messagesEl.append(row);content.scrollTop=content.scrollHeight;return bubble}
function setBusy(v){busy=v;$('#send').disabled=v;input.disabled=v}
async function sendMessage(text){if(busy||!text.trim())return;showChat();messages.push({role:'user',content:text.trim()});addMessage('user',text.trim());input.value='';input.style.height='auto';const bubble=addMessage('assistant','Thinking…');bubble.classList.add('typing');setBusy(true);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Something went wrong.');bubble.classList.remove('typing');bubble.textContent=data.reply;messages.push({role:'assistant',content:data.reply});$('#history').textContent='Recent conversation';}catch(e){bubble.classList.remove('typing');bubble.classList.add('error');bubble.textContent=e.message+' If you manage this app, check that GROQ_API_KEY is configured on the server.';}finally{setBusy(false);input.focus();content.scrollTop=content.scrollHeight}}
$('#form').addEventListener('submit',e=>{e.preventDefault();sendMessage(input.value)});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit()}});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>sendMessage(b.dataset.prompt)));function reset(){messages=[];messagesEl.innerHTML='';messagesEl.classList.add('hidden');welcome.classList.remove('hidden');$('#history').textContent='Your conversations will appear here.';input.value='';}$('#newChat').onclick=()=>{reset();$('#sidebar').classList.remove('open');input.focus()};$('#clear').onclick=reset;$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');
</script></body></html>
