name: devora_ai
description: Native Devora AI Flutter application
publish_to: "none"
version: 1.0.0+2
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: 2.5.3
  shared_preferences_android: 2.4.15
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  file_saver: ^0.2.14
  file_picker: ^10.3.7
  path_provider: ^2.1.5
  record: ^6.1.2
  video_player: ^2.9.2
  audioplayers: ^6.1.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/devora_app_icon.jpg"
  adaptive_icon_background: "#030711"
  adaptive_icon_foreground: "assets/devora_app_icon.jpg"
  min_sdk_android: 21
