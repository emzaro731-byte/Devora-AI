    name: devora-long-video-worker
    runtime: docker
    dockerfilePath: ./long-video-worker/Dockerfile
    dockerContext: ./long-video-worker
    plan: starter
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        value: https://vihbsfrwnslnmheowkhy.supabase.co
